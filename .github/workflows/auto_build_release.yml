name: Auto Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build Piko patches
        run: ./gradlew clean buildAndroid

      - name: Collect patch bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"

          if [[ -z "$MPP" ]]; then
            echo "::error::No .mpp patch bundle was produced."
            exit 1
          fi

          TAG="build-${GITHUB_RUN_NUMBER}"
          OUT="dist/Piko-${TAG}.mpp"

          cp "$MPP" "$OUT"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: piko-${{ env.RELEASE_TAG }}
          path: ${{ env.RELEASE_FILE }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_FILE" \
            --target "$GITHUB_SHA" \
            --title "Piko $RELEASE_TAG" \
            --notes "Automated Piko patch build from commit $GITHUB_SHA." \
            --prerelease
